{{- $mode := .Values.mode | default "proxy" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alpine-tor.fullname" . }}
  labels:
    {{- include "alpine-tor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if eq $mode "proxy" }}
    - port: {{ .Values.service.torsocksport }}
      targetPort: {{ .Values.service.torsocksport }}
      {{- if .Values.samenodeport }}
      nodePort: {{ .Values.service.torsocksport }}
      {{- end }}
      protocol: TCP
      name: socks5port
    {{- else }}
    - port: {{ .Values.service.tororport }}
      targetPort: {{ .Values.service.tororport }}
      {{- if .Values.samenodeport }}
      nodePort: {{ .Values.service.tororport }}
      {{- end }}
      protocol: TCP
      name: orport
    {{- if and (eq $mode "bridge") .Values.service.tortransportport }}
    - port: {{ .Values.service.tortransportport }}
      targetPort: {{ .Values.service.tortransportport }}
      {{- if .Values.samenodeport }}
      nodePort: {{ .Values.service.tortransportport }}
      {{- end }}
      protocol: TCP
      name: obfs4
    {{- end }}
    {{- if and (eq $mode "exit") .Values.service.tordirport }}
    - port: {{ .Values.service.tordirport }}
      targetPort: {{ .Values.service.tordirport }}
      {{- if .Values.samenodeport }}
      nodePort: {{ .Values.service.tordirport }}
      {{- end }}
      protocol: TCP
      name: dirport
    {{- end }}
    {{- end }}
  
  selector:
    {{- include "alpine-tor.selectorLabels" . | nindent 4 }}
